name: PATH request validation on v2
on:
  push:
    branches: [codex/path-worker-805-v2-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  path:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    env:
      BLAZE_BACKEND: ${{ matrix.backend }}
      BLAZE_OPT: '2'
      BLAZE_EMIT: fast
      BLAZE_TESTS: verify
      BLAZE_CACHE_MAX: off
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-path-${{ matrix.backend }}
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
      - name: Formatting of changed Rust files
        run: |
          rustfmt --edition 2024 crates/blaze-core/src/process/spawn.rs
          git diff -- crates/blaze-core/src/process/spawn.rs crates/blaze-core/src/process/spawn/tests.rs > "$RUNNER_TEMP/format.patch"
      - name: Install the repository's bootstrap
        run: |
          sh install.sh --version "$(cat .github/blaze-version)" --verbose
          blaze --version
          echo "BLAZE_CACHE=$RUNNER_TEMP/path-store" >> "$GITHUB_ENV"
      - name: The regressions fail on unmodified upstream
        timeout-minutes: 40
        run: |
          cp crates/blaze-core/src/process/spawn.rs "$RUNNER_TEMP/fixed.rs"
          git show c0ecb0b8d54ef0f0413c1cfd45ae225bf3cf7d01:crates/blaze-core/src/process/spawn.rs > crates/blaze-core/src/process/spawn.rs
          set +e
          blaze test -p blaze-core --release --lib process::spawn::tests::path -- --nocapture 2>&1 | tee "$RUNNER_TEMP/before.log"
          result=${PIPESTATUS[0]}
          set -e
          cp "$RUNNER_TEMP/fixed.rs" crates/blaze-core/src/process/spawn.rs
          test "$result" != 0
          grep -F '3 failed' "$RUNNER_TEMP/before.log"
      - name: Focused regressions on the fix
        if: always() && !cancelled()
        timeout-minutes: 30
        run: |
          test ! -f "$RUNNER_TEMP/fixed.rs" || cp "$RUNNER_TEMP/fixed.rs" crates/blaze-core/src/process/spawn.rs
          blaze test -p blaze-core --release --lib process::spawn::tests::path -- --nocapture 2>&1 | tee "$RUNNER_TEMP/after.log"
      - name: All core unit tests
        timeout-minutes: 15
        run: blaze test -p blaze-core --release --lib 2>&1 | tee "$RUNNER_TEMP/core.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: path-v2-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/before.log
            ${{ runner.temp }}/after.log
            ${{ runner.temp }}/core.log
            ${{ runner.temp }}/blaze*/**/log
          retention-days: 7
