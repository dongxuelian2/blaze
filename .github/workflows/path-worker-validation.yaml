name: PATH worker validation
on:
  push:
    branches: [codex/path-worker-805-validation]
    paths: ['crates/**', 'Cargo.*', 'harness/toolchain', 'flake.*', '.github/workflows/path-worker-validation.yaml']
  workflow_dispatch:
    inputs:
      compiler_run:
        description: 'Use compiler artifact from this run for harness-only checks; empty builds current source'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all --check
      # The fast/full train builds the release binary with cargo, then tests its behavior.
      - name: Build the compiler as the release train does
        id: build
        if: inputs.compiler_run == ''
        run: nix develop --command cargo build -p blaze-engine --release --features llvm --locked
      - name: Build the pinned proc-macro server
        if: inputs.compiler_run == ''
        run: nix develop --command python3 .github/scripts/build_release.py --server-beside target/release/blaze-engine
      - name: Reuse the explicitly selected compiler for harness-only checks
        if: inputs.compiler_run != ''
        uses: actions/download-artifact@v7
        with:
          name: path-worker-compiler
          run-id: ${{ inputs.compiler_run }}
          github-token: ${{ github.token }}
          path: target/release
      - if: inputs.compiler_run != ''
        run: chmod +x target/release/blaze target/release/blaze-engine target/release/blaze-rustc target/release/blaze-proc-macro-srv
      - name: Versions
        run: |
          target/release/blaze-engine --version
          rustc -vV
          uname -a
      - name: Focused regression under Cranelift and LLVM
        env:
          BLAZE_BIN: ${{ github.workspace }}/target/release/blaze-engine
        run: |
          for backend in cranelift llvm; do
            BLAZE_BACKEND=$backend BLAZE_OPT=2 BLAZE_EMIT=fast python3 harness/pathenv.py "{\"blaze\":\"$PWD/target/release/blaze\",\"work\":\"/tmp/path-worker-$backend\"}"
          done
      - name: Existing script environment, reload and concurrency regressions
        env:
          BLAZE_BIN: ${{ github.workspace }}/target/release/blaze-engine
        run: |
          for backend in cranelift llvm; do
            export BLAZE_BACKEND=$backend BLAZE_OPT=2 BLAZE_EMIT=fast
            python3 harness/scriptenv.py
            python3 harness/loadretry.py
            python3 harness/stress.py
          done
      - name: Preserve compiler for subsequent focused checks
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: path-worker-compiler
          path: |
            target/release/blaze
            target/release/blaze-engine
            target/release/blaze-rustc
            target/release/blaze-proc-macro-srv
          retention-days: 7
      - name: Preserve results and worker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: path-worker-results
          path: |
            /tmp/path-worker-*/results.json
            /tmp/path-worker-*/*.stdout
            /tmp/path-worker-*/*.stderr
            /tmp/path-worker-*/*.status
            /tmp/path-worker-*/assembler.log
            /tmp/path-worker-*/*-home/daemon.log
            /tmp/path-worker-*/*-home/workers/*/log
          retention-days: 7

  gate:
    needs: focused
    uses: ./.github/workflows/blaze-platform.yaml
    with:
      platform: linux-x64
      os: ubuntu-24.04
      tier: gate
